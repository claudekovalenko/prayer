<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#f6f1e7">
<title>Prayer Topics</title>
<meta name="description" content="A private prayer list with updates and a guided pray-through mode.">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Prayer">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" sizes="180x180" href="icons/apple-touch-icon.png">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="icon" sizes="192x192" href="icons/icon-192.png">
<style>
  :root {
    --bg: #f6f1e7;
    --card: #fffdf8;
    --ink: #2b2620;
    --muted: #7a7166;
    --line: #e6dfd2;
    --accent: #6b4f2a;
    --accent-ink: #fffaf0;
    --soft: #efe6d6;
    --good: #3f7a4f;
    --danger: #a33d3d;
    --heat-1: #e8dcc6;
    --heat-2: #cdb68c;
    --heat-3: #a5854f;
    --heat-4: #6b4f2a;
    --radius: 14px;
    --shadow: 0 1px 2px rgba(40,30,10,.06), 0 6px 20px rgba(40,30,10,.06);
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #171512;
      --card: #211e1a;
      --ink: #efe8dc;
      --muted: #a39a8c;
      --line: #322d27;
      --accent: #d5b07c;
      --accent-ink: #1c1712;
      --soft: #2a251f;
      --good: #7fc08f;
      --danger: #e08585;
      --heat-1: #3a3228;
      --heat-2: #6b5836;
      --heat-3: #a1834f;
      --heat-4: #d5b07c;
      --shadow: 0 1px 2px rgba(0,0,0,.4), 0 6px 20px rgba(0,0,0,.35);
    }
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; }
  body {
    background: var(--bg);
    color: var(--ink);
    font-family: "Iowan Old Style", "Palatino Linotype", Palatino, Georgia, "Times New Roman", serif;
    font-size: 17px;
    line-height: 1.45;
    -webkit-font-smoothing: antialiased;
    padding-bottom: env(safe-area-inset-bottom);
  }
  .app { max-width: 640px; margin: 0 auto; padding: 20px 16px 48px; }

  header { display: flex; align-items: baseline; justify-content: space-between; gap: 12px; margin-bottom: 8px; }
  h1 { font-size: 28px; font-weight: 600; margin: 0; letter-spacing: -0.01em; }
  .sub { color: var(--muted); font-size: 15px; margin: 0 0 18px; }
  .verse { font-style: italic; color: var(--muted); font-size: 15px; margin: 0 0 20px; border-left: 3px solid var(--line); padding-left: 12px; }

  button {
    font: inherit;
    color: var(--ink);
    background: var(--soft);
    border: 1px solid var(--line);
    border-radius: 999px;
    padding: 8px 14px;
    cursor: pointer;
    line-height: 1.2;
  }
  button:active { transform: translateY(1px); }
  button.primary { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); font-weight: 600; }
  button.ghost { background: transparent; border-color: transparent; color: var(--muted); padding: 6px 8px; }
  button.danger { color: var(--danger); }
  button.small { font-size: 14px; padding: 6px 11px; }
  button:disabled { opacity: .45; cursor: default; }

  .toolbar { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 18px; }
  .toolbar .spacer { flex: 1; }

  .list { display: flex; flex-direction: column; gap: 10px; }
  .card {
    background: var(--card);
    border: 1px solid var(--line);
    border-radius: var(--radius);
    box-shadow: var(--shadow);
    overflow: hidden;
  }
  .card-head {
    display: flex; align-items: center; gap: 10px;
    padding: 14px 16px; cursor: pointer; user-select: none;
  }
  .card-head .title { flex: 1; font-size: 18px; font-weight: 600; }
  .card-head .meta { color: var(--muted); font-size: 13px; white-space: nowrap; }
  .card-head .chev { color: var(--muted); transition: transform .15s; }
  .card.open .chev { transform: rotate(90deg); }
  .card-body { display: none; padding: 0 16px 16px; border-top: 1px dashed var(--line); }
  .card.open .card-body { display: block; }
  .desc { color: var(--muted); margin: 12px 0 14px; white-space: pre-wrap; }
  .desc:empty { display: none; }

  .notes h4 { margin: 14px 0 8px; font-size: 14px; text-transform: uppercase; letter-spacing: .06em; color: var(--muted); font-weight: 600; }
  .note { padding: 10px 12px; background: var(--soft); border-radius: 10px; margin-bottom: 8px; position: relative; }
  .note .date { font-size: 13px; color: var(--muted); margin-bottom: 2px; display: flex; justify-content: space-between; gap: 8px; }
  .note .text { white-space: pre-wrap; }
  .note .del { background: none; border: none; color: var(--muted); padding: 0 4px; font-size: 13px; }
  .note .del:hover { color: var(--danger); }
  .empty { color: var(--muted); font-style: italic; font-size: 15px; }

  .note-form { display: flex; flex-direction: column; gap: 8px; margin-top: 10px; }
  textarea, input[type=text] {
    font: inherit; color: var(--ink);
    background: var(--card); border: 1px solid var(--line); border-radius: 10px;
    padding: 10px 12px; width: 100%; resize: vertical;
  }
  textarea { min-height: 70px; }
  textarea:focus, input:focus { outline: 2px solid var(--accent); outline-offset: 1px; }
  .row { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
  .row .spacer { flex: 1; }

  .actions { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 14px; padding-top: 12px; border-top: 1px dashed var(--line); }

  /* modal */
  .modal-bg {
    position: fixed; inset: 0; background: rgba(0,0,0,.45);
    display: none; align-items: flex-end; justify-content: center; z-index: 10;
  }
  .modal-bg.show { display: flex; }
  .modal {
    background: var(--card); color: var(--ink);
    width: 100%; max-width: 640px; border-radius: 18px 18px 0 0;
    padding: 18px 16px calc(18px + env(safe-area-inset-bottom));
    max-height: 90vh; overflow: auto;
  }
  @media (min-width: 700px) {
    .modal-bg { align-items: center; }
    .modal { border-radius: 18px; }
  }
  .modal h2 { margin: 0 0 12px; font-size: 20px; }
  label { display: block; font-size: 14px; color: var(--muted); margin: 10px 0 4px; }

  /* pray mode */
  .pray { display: none; }
  body.praying .home { display: none; }
  body.praying .pray { display: block; }
  .pray-card {
    background: var(--card); border: 1px solid var(--line); border-radius: 20px;
    box-shadow: var(--shadow); padding: 28px 22px; min-height: 55vh;
    display: flex; flex-direction: column;
  }
  .pray-card .counter { color: var(--muted); font-size: 14px; letter-spacing: .06em; text-transform: uppercase; }
  .pray-card h2 { font-size: 30px; margin: 10px 0 8px; font-weight: 600; line-height: 1.2; }
  .pray-card .desc { font-size: 17px; margin-top: 0; }
  .pray-card .recent h4 { margin: 18px 0 8px; font-size: 13px; text-transform: uppercase; letter-spacing: .06em; color: var(--muted); }
  .pray-card .fill { flex: 1; }
  .pray-nav { display: flex; gap: 8px; margin-top: 18px; align-items: center; }
  .pray-nav .spacer { flex: 1; }
  .progress { height: 4px; background: var(--line); border-radius: 2px; margin: 14px 0 0; overflow: hidden; }
  .progress > div { height: 100%; background: var(--accent); transition: width .2s; }
  .done-card { text-align: center; padding: 40px 20px; }
  .done-card h2 { font-size: 28px; margin-bottom: 8px; }

  /* the Lord's Prayer */
  .lords { display: none; }
  body.praying-lords .home { display: none; }
  body.praying-lords .lords { display: block; }
  .lords .line {
    font-size: 27px; line-height: 1.3; font-weight: 600; margin: 10px 0 4px;
    text-wrap: balance;
  }
  .lords .ref { color: var(--muted); font-size: 14px; letter-spacing: .04em; }
  .lords .theme { color: var(--accent); font-size: 13px; text-transform: uppercase; letter-spacing: .07em; font-weight: 600; }
  .lords ul { margin: 16px 0 0; padding: 0; list-style: none; display: flex; flex-direction: column; gap: 10px; }
  .lords ul li { color: var(--muted); padding-left: 16px; position: relative; }
  .lords ul li::before { content: '·'; position: absolute; left: 4px; color: var(--accent); font-weight: 700; }
  .lords .full {
    margin-top: 18px; padding-top: 14px; border-top: 1px dashed var(--line);
    font-style: italic; color: var(--muted); font-size: 15px; white-space: pre-line;
  }

  /* history */
  .history { display: none; }
  body.viewing-history .home { display: none; }
  body.viewing-history .history { display: block; }
  .history h1 { font-size: 28px; margin: 0 0 4px; font-weight: 600; }

  .stats { display: flex; gap: 10px; margin: 0 0 18px; }
  .stat {
    flex: 1; background: var(--card); border: 1px solid var(--line);
    border-radius: 12px; padding: 12px; text-align: center;
  }
  .stat .n { font-size: 24px; font-weight: 600; font-variant-numeric: tabular-nums; display: block; }
  .stat .l { font-size: 12px; color: var(--muted); text-transform: uppercase; letter-spacing: .05em; }

  .cal-head { display: flex; align-items: center; gap: 8px; margin-bottom: 10px; }
  .cal-head .month { flex: 1; font-size: 18px; font-weight: 600; text-align: center; }
  .cal-head button { padding: 6px 12px; }
  .cal {
    display: grid; grid-template-columns: repeat(7, 1fr); gap: 5px;
    background: var(--card); border: 1px solid var(--line);
    border-radius: var(--radius); padding: 12px; box-shadow: var(--shadow);
  }
  .cal .dow { text-align: center; font-size: 11px; color: var(--muted); text-transform: uppercase; letter-spacing: .05em; padding-bottom: 2px; }
  .cal .day {
    position: relative;
    aspect-ratio: 1; border: 1px solid var(--line); border-radius: 9px;
    background: transparent; color: var(--ink);
    display: flex; align-items: center; justify-content: center;
    font-size: 14px; font-variant-numeric: tabular-nums; padding: 0;
    cursor: pointer;
  }
  .cal .day.blank { border: none; cursor: default; }
  .cal .day.h1 { background: var(--heat-1); border-color: var(--heat-1); }
  .cal .day.h2 { background: var(--heat-2); border-color: var(--heat-2); }
  .cal .day.h3 { background: var(--heat-3); border-color: var(--heat-3); color: var(--accent-ink); }
  .cal .day.h4 { background: var(--heat-4); border-color: var(--heat-4); color: var(--accent-ink); font-weight: 600; }
  .cal .day.today { box-shadow: inset 0 0 0 2px var(--muted); }
  .cal .day.sel { outline: 2px solid var(--accent); outline-offset: 1px; }
  .cal .day.future { color: var(--muted); opacity: .45; cursor: default; }
  .cal .day .lp {
    position: absolute; top: 4px; right: 4px; width: 5px; height: 5px;
    border-radius: 50%; background: var(--accent);
  }
  .cal .day.h3 .lp, .cal .day.h4 .lp { background: var(--accent-ink); }
  .legend { display: flex; align-items: center; gap: 6px 10px; justify-content: flex-end; flex-wrap: wrap; margin-top: 10px; font-size: 12px; color: var(--muted); }
  .legend .scale { display: flex; align-items: center; gap: 6px; }
  .legend i { width: 14px; height: 14px; border-radius: 4px; border: 1px solid var(--line); display: inline-block; }
  .legend i.dot { width: 6px; height: 6px; border-radius: 50%; background: var(--accent); border: none; }

  .day-detail { margin-top: 20px; }
  .day-detail h3 { font-size: 18px; margin: 0 0 10px; font-weight: 600; }
  .prayed-row {
    display: flex; align-items: baseline; gap: 4px 10px; flex-wrap: wrap;
    padding: 10px 12px; background: var(--card); border: 1px solid var(--line);
    border-radius: 10px; margin-bottom: 8px;
  }
  .prayed-row .t { flex: 1; font-weight: 600; }
  .prayed-row .when { font-size: 13px; color: var(--muted); white-space: nowrap; font-variant-numeric: tabular-nums; }
  .prayed-row .n { width: 100%; color: var(--muted); font-size: 15px; white-space: pre-wrap; margin-top: 2px; }
  .prayed-row .n b { color: var(--ink); font-weight: 600; font-size: 13px; display: block; }
  .prayed-row.lp-row { border-left: 3px solid var(--accent); }

  .topic-stats { font-size: 13px; color: var(--muted); margin: -4px 0 12px; }
  .dots { display: flex; gap: 3px; margin: 8px 0 0; flex-wrap: wrap; }
  .dots i { width: 8px; height: 8px; border-radius: 2px; background: var(--line); display: inline-block; }
  .dots i.on { background: var(--accent); }

  .hidden { display: none !important; }
  .footer { margin-top: 26px; color: var(--muted); font-size: 13px; text-align: center; }
  .footer button { font-size: 13px; }
</style>
</head>
<body>
<div class="app">

  <!-- ============ HOME ============ -->
  <section class="home">
    <header>
      <h1>Prayer Topics</h1>
      <button class="ghost small" id="btn-add">+ Add topic</button>
    </header>
    <p class="sub" id="summary"></p>
    <p class="verse">“Trust in the Lord with all your heart, and do not lean on your own understanding. In all your ways acknowledge him, and he will make straight your paths.” — Proverbs 3:5–6</p>

    <div class="toolbar">
      <button class="primary" id="btn-pray">Pray through all</button>
      <button id="btn-lords">The Lord's Prayer</button>
      <button id="btn-history">History</button>
      <button id="btn-collapse">Collapse all</button>
    </div>

    <div class="list" id="list"></div>

    <div class="footer">
      Saved in this browser only.
      <button class="ghost" id="btn-export">Export</button>
      <button class="ghost" id="btn-import">Import</button>
      <input type="file" id="file-import" accept="application/json" class="hidden">
    </div>
  </section>

  <!-- ============ PRAY MODE ============ -->
  <section class="pray">
    <div class="toolbar">
      <button class="ghost" id="btn-exit-pray">← Back</button>
      <span class="spacer"></span>
    </div>
    <div id="pray-view"></div>
  </section>

  <!-- ============ LORD'S PRAYER ============ -->
  <section class="lords">
    <div class="toolbar">
      <button class="ghost" id="btn-exit-lords">← Back</button>
      <span class="spacer"></span>
    </div>
    <div id="lords-view"></div>
  </section>

  <!-- ============ HISTORY ============ -->
  <section class="history">
    <div class="toolbar">
      <button class="ghost" id="btn-exit-history">← Back</button>
      <span class="spacer"></span>
    </div>
    <h1>History</h1>
    <p class="sub" id="history-summary"></p>
    <div id="history-view"></div>
  </section>

</div>

<!-- ============ EDIT MODAL ============ -->
<div class="modal-bg" id="modal">
  <div class="modal">
    <h2 id="modal-title">Add topic</h2>
    <label for="f-title">Title</label>
    <input type="text" id="f-title" placeholder="e.g. My wife">
    <label for="f-desc">What you're asking God for (optional)</label>
    <textarea id="f-desc" placeholder="A few words to help you pray for this topic."></textarea>
    <div class="row" style="margin-top:14px">
      <button class="ghost danger" id="modal-delete">Delete</button>
      <span class="spacer"></span>
      <button id="modal-cancel">Cancel</button>
      <button class="primary" id="modal-save">Save</button>
    </div>
  </div>
</div>

<script>
(() => {
  const STORAGE_KEY = 'prayer-topics.v1';

  const SEED = [
    { title: 'My family',
      desc: 'For their health, their faith, and for God to draw each of them closer to himself.' },
    { title: 'My wife',
      desc: 'For her walk with God, her joy, and for us to grow together in love and unity.' },
    { title: 'Our future children',
      desc: 'For the children God may give us, that they would know and love him from an early age.' },
    { title: 'Clarity about community & church',
      desc: 'For clear direction about which church and community to be part of in this next season, and for peace as I wait.' },
    { title: 'My relationship with God',
      desc: 'To know him more deeply, to hear his voice, and to love him with all my heart.' },
    { title: 'Disciples I\'m pouring into',
      desc: 'For the people I\'m discipling: that they would grow in faith, and that I\'d have wisdom and patience.' },
    { title: 'The Ephesus house',
      desc: 'For God\'s leading, protection, and blessing over the Ephesus house and everyone in it.' },
    { title: 'Neighbors & nations',
      desc: 'For my neighbors to encounter Jesus, and for the gospel to reach every nation.' },
    { title: 'My seminary', v: 2,
      desc: 'For my studies: focus, understanding, and the time and provision to do them well. That what I learn would deepen my love for God rather than dry it out. And for the school itself, my professors and classmates, and where all of this is leading.' },
    { title: 'Continued clarity in God\'s leading',
      desc: 'That God would keep leading and guiding me clearly, and that I would follow him with an open hand.' },
  ];
  // Bumped when a topic is added to SEED, so existing saves pick it up once.
  const SEED_VERSION = 2;

  // Matthew 6:9–13, one movement at a time, with what each line opens up.
  const LORDS = [
    { theme: 'Who he is to you',
      line: 'Our Father in heaven',
      prompts: [
        'Come as a son, not a stranger. He is your Father before he is anything else to you.',
        'Thank him that you have access, today, without an appointment.',
        'Tell him what it means to you right now that he is a good Father.',
      ] },
    { theme: 'Worship',
      line: 'Hallowed be your name',
      prompts: [
        'Praise him for one thing about his character, not one thing he has done for you.',
        'Ask that his name would be honored in your home, your words, and your work.',
        'Let this be the part where you want nothing. Just adore him.',
      ] },
    { theme: 'Surrender',
      line: 'Your kingdom come, your will be done, on earth as it is in heaven',
      prompts: [
        'Where are you asking him to bless your plan instead of asking for his?',
        'Pray his kingdom into the places on your list: your family, your church, the Ephesus house, your neighbors and the nations.',
        'Say honestly what you want, then hand it to him open-handed.',
      ] },
    { theme: 'Dependence',
      line: 'Give us this day our daily bread',
      prompts: [
        'Ask plainly for today’s needs: provision, work, health, strength, your studies.',
        'Ask for enough for today. He did not teach you to ask for the whole year.',
        'Name the people who need bread today, and ask on their behalf.',
      ] },
    { theme: 'Forgiveness',
      line: 'And forgive us our debts, as we also have forgiven our debtors',
      prompts: [
        'Name what you have actually done, specifically, not in general.',
        'Receive his forgiveness instead of arguing with it.',
        'Who are you still holding something against? Ask for grace to let it go.',
      ] },
    { theme: 'Protection',
      line: 'And lead us not into temptation, but deliver us from evil',
      prompts: [
        'Name where you are weak this week, and ask to be kept.',
        'Ask him to go ahead of you into what you are walking into.',
        'Pray protection over the people you love and the ones you are discipling.',
      ] },
  ];
  const DOXOLOGY = 'For yours is the kingdom,\nand the power, and the glory,\nforever. Amen.';

  // ---------- state ----------
  const uid = () => Math.random().toString(36).slice(2, 10) + Date.now().toString(36);

  // Older saves kept only `lastPrayed`; carry it over as the first history entry.
  function migrate(data) {
    data.topics.forEach(t => {
      if (!Array.isArray(t.prayed)) t.prayed = t.lastPrayed ? [t.lastPrayed] : [];
      t.prayed = t.prayed.filter(x => typeof x === 'string' && !isNaN(new Date(x))).sort();
      delete t.lastPrayed;
      if (!Array.isArray(t.notes)) t.notes = [];
    });
    if (!data.open || typeof data.open !== 'object') data.open = {};
    if (!Array.isArray(data.lords)) data.lords = [];
    // Topics added to SEED after this save was created get appended once. The
    // stored version then matches, so a topic deleted later stays deleted.
    const seen = new Set(data.topics.map(t => String(t.title).trim().toLowerCase()));
    const from = Number(data.seedVersion) || 1;
    if (from < SEED_VERSION) {
      SEED.filter(s => (s.v || 1) > from && !seen.has(s.title.trim().toLowerCase()))
        .forEach(s => data.topics.push({ id: uid(), title: s.title, desc: s.desc, notes: [], prayed: [] }));
    }
    data.seedVersion = SEED_VERSION;
    return data;
  }
  function load() {
    try {
      const raw = localStorage.getItem(STORAGE_KEY);
      if (raw) {
        const data = JSON.parse(raw);
        if (data && Array.isArray(data.topics)) return migrate(data);
      }
    } catch (e) { /* ignore */ }
    return { topics: SEED.map(t => ({ id: uid(), title: t.title, desc: t.desc, notes: [], prayed: [] })), open: {}, lords: [], seedVersion: SEED_VERSION };
  }
  function save() {
    try { localStorage.setItem(STORAGE_KEY, JSON.stringify(state)); } catch (e) { /* ignore */ }
  }
  let state = load();
  const $ = sel => document.querySelector(sel);
  save(); // persist the migrated shape (and the seed topics on a first visit)

  // ---------- helpers ----------
  // Day keys are local dates, so praying at 10pm counts for that evening, not
  // the next UTC day.
  function dayKey(d = new Date()) {
    const x = d instanceof Date ? d : new Date(d);
    return `${x.getFullYear()}-${String(x.getMonth() + 1).padStart(2, '0')}-${String(x.getDate()).padStart(2, '0')}`;
  }
  const todayKey = () => dayKey();
  function dateFromKey(k) { const [y, m, d] = k.split('-').map(Number); return new Date(y, m - 1, d); }
  function fmtDate(iso) {
    const d = new Date(iso);
    return d.toLocaleDateString(undefined, { month: 'short', day: 'numeric', year: d.getFullYear() === new Date().getFullYear() ? undefined : 'numeric' });
  }
  function fmtLongDate(d) {
    const today = todayKey(), k = dayKey(d);
    if (k === today) return 'Today';
    const y = new Date(); y.setDate(y.getDate() - 1);
    if (k === dayKey(y)) return 'Yesterday';
    return d.toLocaleDateString(undefined, { weekday: 'long', month: 'long', day: 'numeric', year: d.getFullYear() === new Date().getFullYear() ? undefined : 'numeric' });
  }
  function fmtTime(iso) { return new Date(iso).toLocaleTimeString(undefined, { hour: 'numeric', minute: '2-digit' }); }
  function ago(iso) {
    if (!iso) return 'not yet prayed';
    const days = Math.round((dateFromKey(todayKey()) - dateFromKey(dayKey(iso))) / 86400000);
    if (days <= 0) return 'prayed today';
    if (days === 1) return 'prayed yesterday';
    return `prayed ${days} days ago`;
  }
  function esc(s) {
    return String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
  }

  // Each topic keeps `prayed`: the list of times it was prayed for, oldest first.
  function prayedTimes(t) { return Array.isArray(t.prayed) ? t.prayed : []; }
  function lastPrayed(t) { const p = prayedTimes(t); return p.length ? p[p.length - 1] : null; }
  function prayedOn(t, key) { return prayedTimes(t).some(iso => dayKey(iso) === key); }
  function prayedToday(t) { return prayedOn(t, todayKey()); }
  function markPrayed(t) {
    if (prayedToday(t)) return;
    t.prayed = prayedTimes(t).concat(new Date().toISOString());
    save();
  }
  function unmarkToday(t) {
    const today = todayKey();
    t.prayed = prayedTimes(t).filter(iso => dayKey(iso) !== today);
    save();
  }
  // Day key -> number of topics prayed that day.
  function dayCounts() {
    const counts = {};
    state.topics.forEach(t => {
      new Set(prayedTimes(t).map(dayKey)).forEach(k => { counts[k] = (counts[k] || 0) + 1; });
    });
    return counts;
  }
  function streak(days) {
    const d = new Date();
    if (!days.has(dayKey(d))) d.setDate(d.getDate() - 1); // today still counts if yesterday was prayed
    let n = 0;
    while (days.has(dayKey(d))) { n++; d.setDate(d.getDate() - 1); }
    return n;
  }
  // Every day with any prayer on it, whether topics, the Lord's Prayer, or both.
  function activeDays() {
    const days = new Set(Object.keys(dayCounts()));
    lordsSessions().forEach(s => days.add(dayKey(s.at)));
    return days;
  }

  function topicStats(t) {
    const days = new Set(prayedTimes(t).map(dayKey));
    if (!days.size) return 'Not prayed for yet.';
    const first = dateFromKey([...days].sort()[0]);
    return `Prayed on ${days.size} ${days.size === 1 ? 'day' : 'days'} · since ${first.toLocaleDateString(undefined, { month: 'long', day: 'numeric', year: first.getFullYear() === new Date().getFullYear() ? undefined : 'numeric' })}`;
  }
  function recentDots(t) {
    const out = [];
    const d = new Date(); d.setDate(d.getDate() - 13);
    for (let i = 0; i < 14; i++) {
      const k = dayKey(d);
      out.push(`<i class="${prayedOn(t, k) ? 'on' : ''}" title="${esc(k)}"></i>`);
      d.setDate(d.getDate() + 1);
    }
    return out.join('');
  }

  // ---------- home render ----------
  function renderSummary() {
    const total = state.topics.length;
    const done = state.topics.filter(prayedToday).length;
    $('#summary').textContent = total === 0
      ? 'No topics yet. Add one to get started.'
      : done === total ? `You\'ve prayed through all ${total} topics today.` : `${done} of ${total} prayed for today.`;
    $('#btn-lords').textContent = lordsToday() ? 'The Lord’s Prayer ✓' : 'The Lord’s Prayer';
  }

  function renderList() {
    const list = $('#list');
    list.innerHTML = '';
    state.topics.forEach((t, i) => {
      const card = document.createElement('div');
      card.className = 'card' + (state.open[t.id] ? ' open' : '');
      card.dataset.id = t.id;
      const notes = [...t.notes].sort((a, b) => b.date.localeCompare(a.date));
      card.innerHTML = `
        <div class="card-head">
          <span class="chev">▸</span>
          <span class="title">${esc(t.title)}</span>
          <span class="meta">${prayedToday(t) ? '✓ today' : esc(ago(lastPrayed(t)))}</span>
        </div>
        <div class="card-body">
          <p class="desc">${esc(t.desc)}</p>
          <p class="topic-stats">${esc(topicStats(t))}</p>
          <div class="dots" title="The last 14 days">${recentDots(t)}</div>
          <div class="notes">
            <h4>Updates &amp; answers</h4>
            ${notes.length ? notes.map(n => `
              <div class="note" data-note="${n.id}">
                <div class="date"><span>${esc(fmtDate(n.date))}</span><button class="del" title="Delete note">✕</button></div>
                <div class="text">${esc(n.text)}</div>
              </div>`).join('') : '<p class="empty">No updates yet. Jot down what you\'re asking, what you sense, or how God answers.</p>'}
            <form class="note-form">
              <textarea placeholder="Add an update, an answer, or a specific request…" rows="2"></textarea>
              <div class="row"><span class="spacer"></span><button type="submit" class="small">Add update</button></div>
            </form>
          </div>
          <div class="actions">
            <button class="small ${prayedToday(t) ? '' : 'primary'}" data-act="prayed">${prayedToday(t) ? 'Prayed ✓' : 'Mark prayed'}</button>
            <button class="small" data-act="edit">Edit</button>
            <button class="small ghost" data-act="up" ${i === 0 ? 'disabled' : ''}>↑</button>
            <button class="small ghost" data-act="down" ${i === state.topics.length - 1 ? 'disabled' : ''}>↓</button>
          </div>
        </div>`;
      list.appendChild(card);
    });
    renderSummary();
  }

  function findTopic(id) { return state.topics.find(t => t.id === id); }

  $('#list').addEventListener('click', e => {
    const card = e.target.closest('.card'); if (!card) return;
    const t = findTopic(card.dataset.id); if (!t) return;

    if (e.target.closest('.card-head')) {
      state.open[t.id] = !state.open[t.id];
      save(); renderList(); return;
    }
    const del = e.target.closest('.note .del');
    if (del) {
      const noteEl = del.closest('.note');
      if (confirm('Delete this update?')) {
        t.notes = t.notes.filter(n => n.id !== noteEl.dataset.note);
        save(); renderList();
      }
      return;
    }
    const act = e.target.closest('[data-act]')?.dataset.act;
    if (!act) return;
    const i = state.topics.indexOf(t);
    if (act === 'prayed') { if (prayedToday(t)) unmarkToday(t); else markPrayed(t); renderList(); }
    if (act === 'edit') openModal(t);
    if (act === 'up' && i > 0) { state.topics.splice(i, 1); state.topics.splice(i - 1, 0, t); save(); renderList(); }
    if (act === 'down' && i < state.topics.length - 1) { state.topics.splice(i, 1); state.topics.splice(i + 1, 0, t); save(); renderList(); }
  });

  $('#list').addEventListener('submit', e => {
    e.preventDefault();
    const card = e.target.closest('.card'); const t = findTopic(card.dataset.id);
    const ta = e.target.querySelector('textarea');
    const text = ta.value.trim(); if (!text) return;
    t.notes.push({ id: uid(), date: new Date().toISOString(), text });
    save(); renderList();
  });

  $('#btn-collapse').addEventListener('click', () => { state.open = {}; save(); renderList(); });

  // ---------- modal ----------
  let editing = null;
  function openModal(t) {
    editing = t || null;
    $('#modal-title').textContent = t ? 'Edit topic' : 'Add topic';
    $('#f-title').value = t ? t.title : '';
    $('#f-desc').value = t ? t.desc : '';
    $('#modal-delete').classList.toggle('hidden', !t);
    $('#modal').classList.add('show');
    setTimeout(() => $('#f-title').focus(), 50);
  }
  function closeModal() { $('#modal').classList.remove('show'); editing = null; }
  $('#btn-add').addEventListener('click', () => openModal(null));
  $('#modal-cancel').addEventListener('click', closeModal);
  $('#modal').addEventListener('click', e => { if (e.target === e.currentTarget) closeModal(); });
  $('#modal-save').addEventListener('click', () => {
    const title = $('#f-title').value.trim();
    const desc = $('#f-desc').value.trim();
    if (!title) { $('#f-title').focus(); return; }
    if (editing) { editing.title = title; editing.desc = desc; }
    else { const t = { id: uid(), title, desc, notes: [], prayed: [] }; state.topics.push(t); state.open[t.id] = true; }
    save(); renderList(); closeModal();
  });
  $('#modal-delete').addEventListener('click', () => {
    if (!editing) return;
    if (confirm(`Delete "${editing.title}" and its updates?`)) {
      state.topics = state.topics.filter(t => t !== editing);
      delete state.open[editing.id];
      save(); renderList(); closeModal();
    }
  });
  document.addEventListener('keydown', e => { if (e.key === 'Escape' && $('#modal').classList.contains('show')) closeModal(); });

  // ---------- pray mode ----------
  let prayIdx = 0;
  let prayOrder = [];
  function startPray() {
    if (!state.topics.length) { openModal(null); return; }
    // Start with topics not yet prayed today, then the rest, keeping order.
    const todo = state.topics.filter(t => !prayedToday(t));
    prayOrder = (todo.length ? todo : state.topics).map(t => t.id);
    prayIdx = 0;
    document.body.classList.add('praying');
    renderPray();
    window.scrollTo(0, 0);
  }
  function exitPray() { document.body.classList.remove('praying'); renderList(); }

  function renderPray() {
    const view = $('#pray-view');
    const n = prayOrder.length;
    if (prayIdx >= n) {
      view.innerHTML = `
        <div class="pray-card done-card">
          <div class="fill"></div>
          <h2>Amen.</h2>
          <p class="sub">You prayed through ${n} topic${n === 1 ? '' : 's'}. “Cast all your anxieties on him, because he cares for you.” (1 Peter 5:7)</p>
          <div class="fill"></div>
          <div class="row" style="justify-content:center;gap:8px">
            <button id="pray-lords">Pray the Lord's Prayer</button>
            <button class="primary" id="pray-done">Back to topics</button>
          </div>
        </div>`;
      $('#pray-done').addEventListener('click', exitPray);
      $('#pray-lords').addEventListener('click', startLords);
      return;
    }
    const t = findTopic(prayOrder[prayIdx]);
    if (!t) { prayIdx++; renderPray(); return; }
    const recent = [...t.notes].sort((a, b) => b.date.localeCompare(a.date)).slice(0, 3);
    view.innerHTML = `
      <div class="pray-card">
        <div class="counter">${prayIdx + 1} of ${n}</div>
        <h2>${esc(t.title)}</h2>
        <p class="desc">${esc(t.desc)}</p>
        ${recent.length ? `<div class="recent"><h4>Recent updates</h4>${recent.map(x => `
          <div class="note"><div class="date"><span>${esc(fmtDate(x.date))}</span></div><div class="text">${esc(x.text)}</div></div>`).join('')}</div>` : ''}
        <div class="fill"></div>
        <form class="note-form" id="pray-note">
          <textarea placeholder="Anything to note while you pray? (optional)" rows="2"></textarea>
        </form>
        <div class="progress"><div style="width:${(prayIdx / n) * 100}%"></div></div>
        <div class="pray-nav">
          <button class="ghost" id="pray-prev" ${prayIdx === 0 ? 'disabled' : ''}>Previous</button>
          <span class="spacer"></span>
          <button class="ghost" id="pray-skip">Skip</button>
          <button class="primary" id="pray-next">Amen, next →</button>
        </div>
      </div>`;
    const commitNote = () => {
      const ta = view.querySelector('#pray-note textarea');
      const text = ta.value.trim();
      if (text) { t.notes.push({ id: uid(), date: new Date().toISOString(), text }); save(); }
    };
    $('#pray-prev').addEventListener('click', () => { commitNote(); prayIdx--; renderPray(); window.scrollTo(0, 0); });
    $('#pray-skip').addEventListener('click', () => { commitNote(); prayIdx++; renderPray(); window.scrollTo(0, 0); });
    $('#pray-next').addEventListener('click', () => { commitNote(); markPrayed(t); prayIdx++; renderPray(); window.scrollTo(0, 0); });
    $('#pray-note').addEventListener('submit', e => e.preventDefault());
  }
  $('#btn-pray').addEventListener('click', startPray);
  $('#btn-exit-pray').addEventListener('click', exitPray);

  // ---------- the Lord's Prayer ----------
  function lordsSessions() { return Array.isArray(state.lords) ? state.lords : []; }
  function lordsOn(key) { return lordsSessions().filter(s => dayKey(s.at) === key); }
  function lordsToday() { return lordsOn(todayKey()).length > 0; }

  let lordsIdx = 0;
  let lordsSession = null;

  function startLords() {
    lordsIdx = 0;
    lordsSession = { id: uid(), at: new Date().toISOString(), notes: [] };
    document.body.classList.remove('praying');
    document.body.classList.add('praying-lords');
    renderLords();
    window.scrollTo(0, 0);
  }
  // Keep the session only once it was prayed through or written in, and keep
  // it current if more is added afterwards.
  function persistLords() {
    if (!lordsSession || !(lordsSession.done || lordsSession.notes.length)) return;
    const all = lordsSessions().filter(s => s.id !== lordsSession.id);
    state.lords = all.concat(lordsSession);
    save();
  }
  function endLords() {
    persistLords();
    lordsSession = null;
    document.body.classList.remove('praying-lords');
    renderList();
  }

  function renderLords() {
    const view = $('#lords-view');
    const n = LORDS.length;
    if (lordsIdx >= n) {
      if (lordsSession) { lordsSession.done = true; persistLords(); }
      view.innerHTML = `
        <div class="pray-card done-card">
          <div class="fill"></div>
          <h2>Amen.</h2>
          <p class="full" style="border:none;margin:0 auto;max-width:22ch;text-align:center">${esc(DOXOLOGY)}</p>
          <div class="fill"></div>
          <div class="row" style="justify-content:center;gap:8px">
            <button id="lords-again">Start over</button>
            <button class="primary" id="lords-done">Back to topics</button>
          </div>
        </div>`;
      $('#lords-done').addEventListener('click', endLords);
      $('#lords-again').addEventListener('click', () => { lordsIdx = 0; renderLords(); window.scrollTo(0, 0); });
      return;
    }
    const p = LORDS[lordsIdx];
    const saved = lordsSession ? (lordsSession.notes.find(x => x.part === p.line) || {}).text || '' : '';
    view.innerHTML = `
      <div class="pray-card">
        <div class="counter">${lordsIdx + 1} of ${n} · Matthew 6</div>
        <div class="theme">${esc(p.theme)}</div>
        <p class="line">“${esc(p.line)}”</p>
        <ul>${p.prompts.map(x => `<li>${esc(x)}</li>`).join('')}</ul>
        <div class="fill"></div>
        <form class="note-form" id="lords-note">
          <textarea placeholder="Anything you want to write down here? (optional)" rows="2">${esc(saved)}</textarea>
        </form>
        <div class="progress"><div style="width:${(lordsIdx / n) * 100}%"></div></div>
        <div class="pray-nav">
          <button class="ghost" id="lords-prev" ${lordsIdx === 0 ? 'disabled' : ''}>Previous</button>
          <span class="spacer"></span>
          <button class="primary" id="lords-next">${lordsIdx === n - 1 ? 'Amen' : 'Next →'}</button>
        </div>
      </div>`;
    const commit = () => {
      if (!lordsSession) return;
      const text = view.querySelector('#lords-note textarea').value.trim();
      lordsSession.notes = lordsSession.notes.filter(x => x.part !== p.line);
      if (text) lordsSession.notes.push({ part: p.line, text });
    };
    $('#lords-prev').addEventListener('click', () => { commit(); lordsIdx--; renderLords(); window.scrollTo(0, 0); });
    $('#lords-next').addEventListener('click', () => { commit(); lordsIdx++; renderLords(); window.scrollTo(0, 0); });
    $('#lords-note').addEventListener('submit', e => e.preventDefault());
  }

  $('#btn-lords').addEventListener('click', startLords);
  $('#btn-exit-lords').addEventListener('click', endLords);

  // ---------- history ----------
  let calMonth = new Date(); calMonth.setDate(1);
  let selectedDay = todayKey();

  function renderHistory() {
    const counts = dayCounts();
    const days = activeDays();
    const allDays = [...days];
    const total = state.topics.length || 1;
    const run = streak(days);
    const thisMonth = allDays.filter(k => k.slice(0, 7) === dayKey(calMonth).slice(0, 7)).length;

    $('#history-summary').textContent = allDays.length
      ? `You've prayed on ${allDays.length} ${allDays.length === 1 ? 'day' : 'days'} so far. Tap a day to see what you prayed for.`
      : 'Once you start praying, your history will build up here.';

    const monthLabel = calMonth.toLocaleDateString(undefined, { month: 'long', year: 'numeric' });
    const first = new Date(calMonth.getFullYear(), calMonth.getMonth(), 1);
    const daysInMonth = new Date(calMonth.getFullYear(), calMonth.getMonth() + 1, 0).getDate();
    const isCurrentMonth = dayKey(calMonth).slice(0, 7) === todayKey().slice(0, 7);

    const cells = [];
    for (let i = 0; i < first.getDay(); i++) cells.push('<div class="day blank"></div>');
    for (let d = 1; d <= daysInMonth; d++) {
      const k = dayKey(new Date(calMonth.getFullYear(), calMonth.getMonth(), d));
      const n = counts[k] || 0;
      const pct = n / total;
      const heat = n === 0 ? '' : pct >= 1 ? 'h4' : pct >= 0.6 ? 'h3' : pct >= 0.3 ? 'h2' : 'h1';
      const future = k > todayKey();
      const lp = lordsOn(k).length > 0;
      const cls = ['day', heat, k === todayKey() ? 'today' : '', k === selectedDay ? 'sel' : '', future ? 'future' : ''].filter(Boolean).join(' ');
      const label = `${n} topic${n === 1 ? '' : 's'}${lp ? ' · the Lord’s Prayer' : ''}`;
      cells.push(`<button class="${cls}" data-day="${k}" ${future ? 'disabled' : ''} title="${esc(label)}">${d}${lp ? '<span class="lp"></span>' : ''}</button>`);
    }

    $('#history-view').innerHTML = `
      <div class="stats">
        <div class="stat"><span class="n">${run}</span><span class="l">Day streak</span></div>
        <div class="stat"><span class="n">${thisMonth}</span><span class="l">Days in ${esc(calMonth.toLocaleDateString(undefined, { month: 'short' }))}</span></div>
        <div class="stat"><span class="n">${allDays.length}</span><span class="l">Days total</span></div>
      </div>
      <div class="cal-head">
        <button class="small" id="cal-prev" aria-label="Previous month">←</button>
        <span class="month">${esc(monthLabel)}</span>
        <button class="small" id="cal-next" aria-label="Next month" ${isCurrentMonth ? 'disabled' : ''}>→</button>
      </div>
      <div class="cal">
        ${['S', 'M', 'T', 'W', 'T', 'F', 'S'].map(d => `<div class="dow">${d}</div>`).join('')}
        ${cells.join('')}
      </div>
      <div class="legend">
        <span class="scale"><i class="dot"></i>Lord's Prayer</span>
        <span class="scale">Fewer<i></i><i style="background:var(--heat-1)"></i><i style="background:var(--heat-2)"></i><i style="background:var(--heat-3)"></i><i style="background:var(--heat-4)"></i>All topics</span>
      </div>
      <div class="day-detail" id="day-detail"></div>`;

    $('#cal-prev').addEventListener('click', () => { calMonth.setMonth(calMonth.getMonth() - 1); renderHistory(); });
    $('#cal-next').addEventListener('click', () => { calMonth.setMonth(calMonth.getMonth() + 1); renderHistory(); });
    $('#history-view').querySelectorAll('.day[data-day]').forEach(b => {
      b.addEventListener('click', () => { selectedDay = b.dataset.day; renderHistory(); });
    });
    renderDayDetail();
  }

  function renderDayDetail() {
    const prayed = state.topics
      .filter(t => prayedOn(t, selectedDay))
      .map(t => ({
        t,
        at: prayedTimes(t).filter(iso => dayKey(iso) === selectedDay).sort()[0],
        notes: t.notes.filter(n => dayKey(n.date) === selectedDay),
      }))
      .sort((a, b) => a.at.localeCompare(b.at));
    // Notes written that day on topics not marked prayed still belong to the day.
    const extraNotes = state.topics
      .filter(t => !prayedOn(t, selectedDay))
      .map(t => ({ t, notes: t.notes.filter(n => dayKey(n.date) === selectedDay) }))
      .filter(x => x.notes.length);

    const d = dateFromKey(selectedDay);
    const lordsRows = lordsOn(selectedDay).map(s => `
      <div class="prayed-row lp-row">
        <span class="t">The Lord's Prayer</span>
        <span class="when">${esc(fmtTime(s.at))}</span>
        ${[...(s.notes || [])]
          .sort((a, b) => LORDS.findIndex(l => l.line === a.part) - LORDS.findIndex(l => l.line === b.part))
          .map(x => `<span class="n"><b>${esc(x.part)}</b>${esc(x.text)}</span>`).join('')}
      </div>`).join('');
    const rows = lordsRows + prayed.map(({ t, at, notes }) => `
      <div class="prayed-row">
        <span class="t">${esc(t.title)}</span>
        <span class="when">${esc(fmtTime(at))}</span>
        ${notes.map(n => `<span class="n">${esc(n.text)}</span>`).join('')}
      </div>`).join('')
      + extraNotes.map(({ t, notes }) => `
      <div class="prayed-row">
        <span class="t">${esc(t.title)}</span>
        <span class="when">note only</span>
        ${notes.map(n => `<span class="n">${esc(n.text)}</span>`).join('')}
      </div>`).join('');

    $('#day-detail').innerHTML = `
      <h3>${esc(fmtLongDate(d))}</h3>
      ${rows || `<p class="empty">${selectedDay > todayKey() ? 'Still to come.' : 'Nothing recorded on this day.'}</p>`}`;
  }

  $('#btn-history').addEventListener('click', () => {
    calMonth = new Date(); calMonth.setDate(1);
    selectedDay = todayKey();
    document.body.classList.add('viewing-history');
    renderHistory();
    window.scrollTo(0, 0);
  });
  $('#btn-exit-history').addEventListener('click', () => {
    document.body.classList.remove('viewing-history');
    renderList();
  });

  // ---------- export / import ----------
  $('#btn-export').addEventListener('click', () => {
    const blob = new Blob([JSON.stringify(state, null, 2)], { type: 'application/json' });
    const a = document.createElement('a');
    a.href = URL.createObjectURL(blob);
    a.download = `prayer-topics-${todayKey()}.json`;
    a.click();
    setTimeout(() => URL.revokeObjectURL(a.href), 1000);
  });
  $('#btn-import').addEventListener('click', () => $('#file-import').click());
  $('#file-import').addEventListener('change', e => {
    const file = e.target.files[0]; if (!file) return;
    const reader = new FileReader();
    reader.onload = () => {
      try {
        const data = JSON.parse(reader.result);
        if (!data || !Array.isArray(data.topics)) throw new Error('bad file');
        if (confirm(`Replace your current topics with ${data.topics.length} from this file?`)) {
          state = migrate({ topics: data.topics.map(t => ({ id: t.id || uid(), title: String(t.title || 'Untitled'), desc: String(t.desc || ''), notes: Array.isArray(t.notes) ? t.notes : [], prayed: Array.isArray(t.prayed) ? t.prayed : [], lastPrayed: t.lastPrayed || null })), open: {}, lords: Array.isArray(data.lords) ? data.lords : [], seedVersion: data.seedVersion });
          save(); renderList();
        }
      } catch (err) { alert('That file doesn\'t look like a Prayer Topics export.'); }
      e.target.value = '';
    };
    reader.readAsText(file);
  });

  // ---------- go ----------
  renderList();
  if ('serviceWorker' in navigator && location.protocol.startsWith('http')) {
    navigator.serviceWorker.register('./sw.js').catch(() => {});
  }
})();
</script>
</body>
</html>
